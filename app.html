<script>

// 🔥 FIREBASE (same)
firebase.initializeApp({
apiKey: "AIzaSyABlrB9kBCJV1YS-8t3SJrqHUfPqB-7lMo",
authDomain: "replyshastra.firebaseapp.com",
projectId: "replyshastra",
appId: "1:346754998835:web:ecca09c1bb98a5f9a7f946"
});

const auth = firebase.auth();

auth.onAuthStateChanged(user=>{
if(!user){
window.location="login.html";
}else{
let name = user.email ? user.email.split("@")[0] : "User";
document.getElementById("username").innerText = name;
}
});

// 🔥 ELEMENTS
const menu = document.getElementById("menu");
const menuOverlay = document.getElementById("menuOverlay");
const chat = document.getElementById("chat");
const text = document.getElementById("text");
const popup = document.getElementById("popup");

const sendSound = document.getElementById("sendSound");
const replySound = document.getElementById("replySound");

// 🔊 SOUND UNLOCK
let soundEnabled = false;
document.body.addEventListener('click', ()=>{
soundEnabled = true;
},{once:true});

// 🧠 AI SYSTEM PROMPT
const systemPrompt = `
You are a confident, smart Relationship Coach.

Style:
- Hinglish (Hindi + English mix)
- Friendly but slightly dominant
- Real advice, no boring gyaan

You help with:
- breakup
- attraction
- texting
- girlfriend issues

Rules:
- Short replies
- Practical advice
- Sometimes ask 1 smart question
- Understand emotions deeply

IMPORTANT:
Reply in same language as user.
`;

// MENU
let open=false;
function toggleMenu(){
open=!open;
menu.style.left = open ? "0" : "-260px";
menuOverlay.style.display = open ? "block" : "none";
}
menuOverlay.onclick = toggleMenu;

// CHAT
function addMessage(msg,type){
let div=document.createElement("div");
div.className="msg "+type;
div.innerText=msg;
chat.appendChild(div);
chat.scrollTop=chat.scrollHeight;
}

// 🚀 AI SEND FUNCTION (MAIN UPGRADE)
async function send(){

let msg = text.value.trim();
if(!msg) return;

// 🔊 SEND SOUND
if(soundEnabled){
sendSound.currentTime = 0;
sendSound.play().catch(()=>{});
}

addMessage(msg,"user");
text.value="";

// ⏳ LOADING
let loading = document.createElement("div");
loading.className="msg bot";
loading.innerText="Typing...";
chat.appendChild(loading);
chat.scrollTop=chat.scrollHeight;

try{

let res = await fetch("https://openrouter.ai/api/v1/chat/completions",{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer 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
},
body: JSON.stringify({
model:"mistralai/mistral-7b-instruct",
messages:[
{role:"system", content: systemPrompt},
{role:"user", content: msg}
]
})
});

let data = await res.json();
let reply = data.choices[0].message.content;

// remove loading
chat.removeChild(loading);

// 🔊 REPLY SOUND
if(soundEnabled){
replySound.currentTime = 0;
replySound.play().catch(()=>{});
}

addMessage(reply,"bot");

}catch(e){

chat.removeChild(loading);
addMessage("Bhai thoda error aa gaya 😅 try again","bot");

}

}

// LOGOUT
function logout(){
auth.signOut().then(()=> window.location="login.html");
}

// SHARE
function shareApp(){
if(navigator.share){
navigator.share({
title:"ReplyShastra",
text:"Best AI reply app 🔥",
url:location.href
});
}else{
alert("Sharing not supported");
}
}

// SUBSCRIPTION
function openSubscription(){
alert("💎 Premium ₹99/month coming soon");
}

// INSTALL
let deferredPrompt;

window.addEventListener('beforeinstallprompt',(e)=>{
e.preventDefault();
deferredPrompt=e;
});

function installApp(){
if(deferredPrompt){
deferredPrompt.prompt();
}else{
alert("📲 Chrome menu → Add to Home Screen");
}
}

// POPUP
setTimeout(()=>{
popup.style.display="flex";
},5000);

function closePopup(){
popup.style.display="none";
}

// SW
if('serviceWorker' in navigator){
navigator.serviceWorker.register('sw.js');
}

</script>
