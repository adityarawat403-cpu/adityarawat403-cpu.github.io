<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReplyShastra</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
background:#090013;
color:white;
font-family:'Quicksand';
display:flex;
align-items:center;
justify-content:center;
height:100vh;
flex-direction:column;
margin:0;
overflow:hidden;
}

.logo{
width:120px;
margin-bottom:20px;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.1)}
100%{transform:scale(1)}
}

.title{
font-size:28px;
letter-spacing:6px;
text-shadow:0 0 20px #a855f7;
margin-bottom:20px;
}

.enter{
padding:14px 30px;
border-radius:14px;
border:none;
font-size:18px;
background:linear-gradient(135deg,#7b2cff,#b067ff);
color:white;
cursor:pointer;
}

#cinematic{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#090013;
display:flex;
align-items:center;
justify-content:center;
opacity:0;
pointer-events:none;
transition:1s;
}

#cinematicText{
font-size:28px;
text-align:center;
letter-spacing:4px;
text-shadow:0 0 25px #a855f7;
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{opacity:.4}
to{opacity:1}
}

</style>

</head>

<body>

<img src="icon.png" class="logo">

<div class="title">REPLYSHASTRA</div>

<button class="enter" onclick="enter()">🔱 ENTER</button>

<div id="cinematic">
<div id="cinematicText">WELCOME TO REPLYSHASTRA</div>
</div>

<audio id="introSound" src="intro.mp3"></audio>

<script>

function enter(){

document.getElementById("introSound").play()

let cine=document.getElementById("cinematic")

cine.style.opacity="1"
cine.style.pointerEvents="auto"

setTimeout(()=>{

let user = localStorage.getItem("rs_user")

if(user){
window.location.href="app.html"
}else{
window.location.href="login.html"
}

},2500)

}

</script>

</body>
</html>
