
<script>

// 🔥 SAFE LOAD (sab kuch DOM ke baad chalega)
document.addEventListener("DOMContentLoaded", function(){

// 🔐 USER CHECK
let user = localStorage.getItem("rs_user")

if(!user){
window.location.href="/login.html"
return
}

// 🔥 SAFE NAME FIX
let name = "User"

if(user.includes("@")){
name = user.split("@")[0]
}else{
name = user
}

// 🔥 ELEMENT SAFE LOAD
const usernameEl = document.getElementById("username")
const menuNameEl = document.getElementById("menuName")
const menuOverlay = document.getElementById("menuOverlay")
const chat = document.getElementById("chat")
const text = document.getElementById("text")

if(usernameEl) usernameEl.innerText = name
if(menuNameEl) menuNameEl.innerText = name

// 🔢 REPLY LIMIT
let repliesLeft = localStorage.getItem("replies_left")

if(!repliesLeft){
repliesLeft = 10
localStorage.setItem("replies_left",10)
}

function updateHeader(){
if(usernameEl){
usernameEl.innerText = name + " | " + repliesLeft + " left"
}
}

updateHeader()

// 📂 MENU
let menuOpen=false

window.toggleMenu = function(){

const menu=document.getElementById("menu")

menuOpen=!menuOpen

if(menu) menu.style.left = menuOpen ? "0" : "-260px"
if(menuOverlay) menuOverlay.style.display = menuOpen ? "block" : "none"

}

if(menuOverlay){
menuOverlay.onclick = toggleMenu
}

// 💬 ADD MESSAGE
window.addMessage = function(msg,type){

if(!chat) return

let div=document.createElement("div")
div.className="msg "+type
div.innerText=msg

if(type==="bot"){

let copy=document.createElement("div")
copy.className="copyBtn"
copy.innerText="Copy"

copy.onclick=()=>{
navigator.clipboard.writeText(msg)
copy.innerText="Copied"
setTimeout(()=>copy.innerText="Copy",1200)
}

div.appendChild(copy)

}

chat.appendChild(div)
chat.scrollTop=chat.scrollHeight

}

// ⏳ TYPING
function showTyping(){

if(!chat) return

let typing=document.createElement("div")
typing.className="typing"
typing.id="typing"
typing.innerHTML="<div class='dot'></div><div class='dot'></div><div class='dot'></div>"

chat.appendChild(typing)

try{
document.getElementById("typingSound")?.play()
}catch{}

}

function removeTyping(){
let t=document.getElementById("typing")
if(t)t.remove()
}

// 🚀 SEND
window.send = function(){

if(repliesLeft<=0){
addMessage("Daily reply limit reached.","bot")
return
}

let msg = text?.value.trim()
if(!msg) return

try{
document.getElementById("sendSound")?.play()
}catch{}

addMessage(msg,"user")

text.value=""

showTyping()

setTimeout(()=>{

removeTyping()

let reply="Example reply generated by AI."

addMessage(reply,"bot")

try{
document.getElementById("replySound")?.play()
}catch{}

repliesLeft--

localStorage.setItem("replies_left",repliesLeft)

updateHeader()

},1200)

}

// ⌨️ ENTER KEY
if(text){
text.addEventListener("keypress",e=>{
if(e.key==="Enter") send()
})
}

// 🚪 LOGOUT
window.logout = function(){
localStorage.removeItem("rs_user")
window.location.href="/login.html"
}

// 📤 SHARE
window.shareApp = function(){

if(navigator.share){

navigator.share({
title:"ReplyShastra AI",
text:"Try ReplyShastra AI",
url:"https://replyshastra.web.app"
})

}else{
alert("Share not supported")
}

}

// 💰 SUBSCRIPTION
window.openSubscription = function(){
alert("Subscription coming soon")
}

// 📲 INSTALL
let deferredPrompt

window.addEventListener('beforeinstallprompt',(e)=>{
e.preventDefault()
deferredPrompt=e
})

window.installApp = function(){

if(deferredPrompt){
deferredPrompt.prompt()
deferredPrompt.userChoice.then(()=>{
deferredPrompt=null
})
}else{
alert("Install not available")
}

}

// 🎬 INTRO FIX
window.onload = () => {

setTimeout(()=>{

let intro=document.getElementById("introScreen")

if(intro){
intro.style.display="none"
}

},2000)

}

}) // DOM END

  </script>
