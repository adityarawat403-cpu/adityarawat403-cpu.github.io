<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReplyShastra Login</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

<!-- ✅ CORRECT FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
body{
background:#0a0015;
font-family:'Quicksand';
display:flex;
align-items:center;
justify-content:center;
height:100vh;
color:white;
margin:0;
}

.card{
background:#140021;
padding:30px;
border-radius:20px;
width:90%;
max-width:350px;
text-align:center;
box-shadow:0 0 30px rgba(123,44,255,0.6);
}

input{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
background:#0e0e14;
color:white;
}

button{
margin-top:12px;
width:100%;
padding:12px;
border:none;
border-radius:12px;
background:linear-gradient(135deg,#7b2cff,#b067ff);
color:white;
font-weight:600;
cursor:pointer;
}
</style>
</head>

<body>

<div class="card">
<h2>ReplyShastra</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="signup()">Signup</button>
<button onclick="login()">Login</button>

<hr>

<input id="phone" placeholder="+91XXXXXXXXXX">
<div id="recaptcha"></div>
<button onclick="sendOTP()">Send OTP</button>

<input id="otp" placeholder="Enter OTP">
<button onclick="verifyOTP()">Verify OTP</button>

<hr>

<button onclick="googleLogin()">Login with Google</button>

</div>

<script>

// 🔥 YOUR CONFIG (READY)
const firebaseConfig = {
apiKey: "AIzaSyABlrB9kBCJV1YS-8t3SJrqHUFpqb-71Mo",
authDomain: "replyshastra.firebaseapp.com",
projectId: "replyshastra",
appId: "1:346754998835:web:ecca09c1bb98a5f9a7f946"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// 🔐 SIGNUP
function signup(){
let email = document.getElementById("email").value;
let pass = document.getElementById("password").value;

auth.createUserWithEmailAndPassword(email,pass)
.then(()=>{
alert("Signup success");
window.location="app.html";
})
.catch(e=>alert(e.message));
}

// 🔐 LOGIN
function login(){
let email = document.getElementById("email").value;
let pass = document.getElementById("password").value;

auth.signInWithEmailAndPassword(email,pass)
.then(()=>{
window.location="app.html";
})
.catch(e=>alert(e.message));
}

// 📱 PHONE OTP
window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha', {
size: 'normal'
});

function sendOTP(){
let phone = document.getElementById("phone").value;

auth.signInWithPhoneNumber(phone, recaptchaVerifier)
.then(result=>{
window.confirmationResult = result;
alert("OTP Sent");
})
.catch(e=>alert(e.message));
}

function verifyOTP(){
let code = document.getElementById("otp").value;

confirmationResult.confirm(code)
.then(()=>{
window.location="app.html";
})
.catch(()=>alert("Invalid OTP"));
}

// 🔵 GOOGLE LOGIN
function googleLogin(){
let provider = new firebase.auth.GoogleAuthProvider();

auth.signInWithPopup(provider)
.then(()=>{
window.location="app.html";
})
.catch(e=>alert(e.message));
}

</script>

</body>
</html>
