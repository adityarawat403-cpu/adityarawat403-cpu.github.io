<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ReplyShastra AI</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7b2cff">
<link rel="icon" href="icon.png">

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Quicksand',sans-serif;}

body{
background:#050008;
color:white;
height:100vh;
overflow:hidden;
}

/* HEADER */
.header{
position:fixed;
top:0;
left:0;
right:0;
height:65px;
display:flex;
align-items:center;
gap:12px;
padding:0 15px;
background:rgba(0,0,0,.55);
z-index:60;
backdrop-filter:blur(10px);
}

.menuBtn{font-size:26px;cursor:pointer;}
.logo img{width:34px;border-radius:10px;}
.username{margin-left:auto;font-size:13px;opacity:.8;}

/* MENU */
.sideMenu{
position:fixed;
top:0;
left:-260px;
width:260px;
height:100%;
background:#140021;
padding:20px;
transition:.35s;
z-index:100;
}

.sideMenu a{
display:block;
margin:18px 0;
color:white;
text-decoration:none;
}

/* OVERLAY */
#menuOverlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
display:none;
z-index:50;
}

/* CHAT */
.chatbox{
position:fixed;
top:65px;
bottom:75px;
left:0;
right:0;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:12px;
background-image:url("weapon-bg.png");
background-size:cover;
}

/* MESSAGES */
.msg{
max-width:78%;
padding:12px;
border-radius:18px;
font-size:15px;
}

.user{
align-self:flex-end;
background:linear-gradient(135deg,#7b2cff,#b067ff);
}

.bot{
align-self:flex-start;
background:#1b1b24;
}

/* INPUT */
.inputArea{
position:fixed;
bottom:0;
left:0;
right:0;
display:flex;
gap:10px;
padding:12px;
background:rgba(0,0,0,.65);
}

input{
flex:1;
padding:14px;
border-radius:14px;
border:none;
background:#0e0e14;
color:white;
}

.sendBtn{
padding:12px 18px;
border:none;
border-radius:14px;
background:white;
color:black;
font-weight:600;
cursor:pointer;
}

/* POPUP */
#premiumPopup{
position:fixed;
inset:0;
background:rgba(0,0,0,0.7);
display:none;
align-items:center;
justify-content:center;
z-index:999;
}

.popupBox{
background:#140021;
padding:25px;
border-radius:18px;
text-align:center;
width:80%;
max-width:320px;
box-shadow:0 0 25px #7b2cff;
}
</style>

</head>

<body>

<!-- MENU -->
<div id="menu" class="sideMenu">
<a href="#" onclick="openSubscription()">Subscription</a>
<a href="#" onclick="installApp()">⬇ Install App</a>
<a href="#" onclick="shareApp()">Share App</a>
<a href="about.html">About</a>
<a href="privacy.html">Privacy</a>
<a href="terms.html">Terms</a>
<a href="#" onclick="logout()">Logout</a>
</div>

<div id="menuOverlay"></div>

<!-- HEADER -->
<div class="header">
<div class="menuBtn" onclick="toggleMenu()">☰</div>
<div class="logo"><img src="icon.png"></div>
<div>ReplyShastra</div>
<div id="username" class="username"></div>
</div>

<!-- CHAT -->
<div id="chat" class="chatbox"></div>

<!-- INPUT -->
<div class="inputArea">
<input id="text" placeholder="Describe your situation...">
<button class="sendBtn" onclick="send()">Send</button>
</div>

<!-- POPUP -->
<div id="premiumPopup">
  <div class="popupBox">
    <h2>🚀 Go Premium</h2>
    <p style="opacity:.7;margin:10px 0">
    Unlock unlimited replies + faster AI ⚡
    </p>

    <button onclick="installApp()" style="
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#7b2cff,#b067ff);
    color:white;">
    ⬇ Download App
    </button>

    <button onclick="closePopup()" style="margin-top:10px;background:none;border:none;color:#aaa;">
    Maybe Later
    </button>
  </div>
</div>

<script>

// FIREBASE
firebase.initializeApp({
apiKey: "AIzaSyABlrB9kBCJV1YS-8t3SJrqHUfPqB-7lMo",
authDomain: "replyshastra.firebaseapp.com",
projectId: "replyshastra",
appId: "1:346754998835:web:ecca09c1bb98a5f9a7f946"
});

const auth = firebase.auth();

// LOGIN CHECK
auth.onAuthStateChanged(user=>{
if(!user){
window.location="login.html";
}else{
let name = user.email ? user.email.split("@")[0] : "User";
document.getElementById("username").innerText = name;
}
});

// MENU FIX
let open=false;
function toggleMenu(){
open=!open;
document.getElementById("menu").style.left = open ? "0" : "-260px";
document.getElementById("menuOverlay").style.display = open ? "block" : "none";
}

document.getElementById("menuOverlay").onclick = toggleMenu;

// CHAT
function addMessage(msg,type){
let div=document.createElement("div");
div.className="msg "+type;
div.innerText=msg;
document.getElementById("chat").appendChild(div);
}

function
