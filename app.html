<script>

const user = localStorage.getItem("rs_user")

if(!user){
window.location="login.html"
}

const name = user.split("@")[0]

document.getElementById("username").innerText=name
document.getElementById("menuName").innerText=name

let repliesLeft = localStorage.getItem("replies_left")

if(!repliesLeft){
repliesLeft=10
localStorage.setItem("replies_left",10)
}

function updateHeader(){
document.getElementById("username").innerText=name+" | "+repliesLeft+" left"
}

updateHeader()

let menuOpen=false

function toggleMenu(){

const menu=document.getElementById("menu")
const overlay=document.getElementById("menuOverlay")

menuOpen=!menuOpen

menu.style.left=menuOpen?"0":"-260px"
overlay.style.display=menuOpen?"block":"none"

}

document.getElementById("menuOverlay").onclick=toggleMenu

const chat=document.getElementById("chat")
const text=document.getElementById("text")

function addMessage(msg,type){

let div=document.createElement("div")
div.className="msg "+type
div.innerText=msg

if(type==="bot"){

let copy=document.createElement("div")
copy.className="copyBtn"
copy.innerText="Copy"

copy.onclick=()=>{
navigator.clipboard.writeText(msg)
copy.innerText="Copied"
setTimeout(()=>copy.innerText="Copy",1200)
}

div.appendChild(copy)

}

chat.appendChild(div)
chat.scrollTop=chat.scrollHeight

}

function showTyping(){

let typing=document.createElement("div")

typing.className="typing"
typing.id="typing"

typing.innerHTML="<div class='dot'></div><div class='dot'></div><div class='dot'></div>"

chat.appendChild(typing)

}

function removeTyping(){

let t=document.getElementById("typing")
if(t)t.remove()

}

// 🔥 AI FUNCTION
async function generateAIReply(userInput){

try{

const response = await fetch("https://api.openai.com/v1/chat/completions",{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer YOUR_OPENAI_API_KEY"
},
body:JSON.stringify({
model:"gpt-4o-mini",
messages:[
{
role:"system",
content:"You generate short, attractive, Hinglish chat replies for real conversations. Keep it emotional and engaging."
},
{
role:"user",
content:userInput
}
]
})
})

const data = await response.json()

return data.choices[0].message.content

}catch(err){

return "Network error. Try again."

}

}

// 🔥 SEND FUNCTION (UPDATED)
async function send(){

if(repliesLeft<=0){
addMessage("Daily reply limit reached.","bot")
return
}

let msg=text.value.trim()
if(!msg)return

addMessage(msg,"user")
text.value=""

showTyping()

let reply = await generateAIReply(msg)

removeTyping()

addMessage(reply,"bot")

repliesLeft--
localStorage.setItem("replies_left",repliesLeft)
updateHeader()

}

function logout(){
localStorage.removeItem("rs_user")
window.location="login.html"
}

  </script>
