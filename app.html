<script>

// 🔥 FIREBASE SAFE INIT (WHITE SCREEN FIX)
try{
firebase.initializeApp({
apiKey: "YOUR_API_KEY",
authDomain: "replyshastra.firebaseapp.com",
projectId: "replyshastra",
appId: "1:346754998835:web:ecca09c1bb98a5f9a7f946"
});
}catch(e){}

const auth = firebase.auth();

// 🔥 LOGIN SAFE (NO WHITE SCREEN)
auth.onAuthStateChanged(user=>{
try{
if(!user){
window.location="login.html";
}else{
let name = user.email ? user.email.split("@")[0] : "User";
document.getElementById("username").innerText = name;
}
}catch(e){
console.log("Auth error:",e);
}
});

// 🔥 ELEMENTS
const menu = document.getElementById("menu");
const menuOverlay = document.getElementById("menuOverlay");
const chat = document.getElementById("chat");
const text = document.getElementById("text");
const popup = document.getElementById("popup");

const sendSound = document.getElementById("sendSound");
const replySound = document.getElementById("replySound");

// 🔥 SOUND HARD FIX
sendSound.load();
replySound.load();

let soundEnabled = false;

// USER FIRST TAP = UNLOCK SOUND
document.body.addEventListener('click', ()=>{
soundEnabled = true;

// silent play trick
sendSound.play().then(()=>sendSound.pause()).catch(()=>{});
replySound.play().then(()=>replySound.pause()).catch(()=>{});

},{once:true});

// MENU
let open=false;
function toggleMenu(){
open=!open;
menu.style.left = open ? "0" : "-260px";
menuOverlay.style.display = open ? "block" : "none";
}
menuOverlay.onclick = toggleMenu;

// CHAT
function addMessage(msg,type){
let div=document.createElement("div");
div.className="msg "+type;
div.innerText=msg;
chat.appendChild(div);
chat.scrollTop=chat.scrollHeight;
}

// 🔥 AI FUNCTION (FUTURE READY)
async function getAIReply(userMsg){
try{
let res = await fetch("https://api.openai.com/v1/chat/completions",{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer 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
},
body:JSON.stringify({
model:"gpt-3.5-turbo",
messages:[
{
role:"system",
content:"You are a smart relationship coach. Give short, practical, confident replies in Hinglish."
},
{
role:"user",
content:userMsg
}
]
})
});

let data = await res.json();
return data.choices[0].message.content;

}catch(e){
return "Network error 😢 try again";
}
}

// SEND
async function send(){
let msg=text.value.trim();
if(!msg) return;

// 🔊 SEND SOUND
if(soundEnabled){
sendSound.currentTime = 0;
sendSound.play().catch(()=>{});
}

addMessage(msg,"user");
text.value="";

// typing effect
addMessage("Typing...", "bot");

let reply = await getAIReply(msg);

// remove typing
chat.removeChild(chat.lastChild);

// 🔊 REPLY SOUND
if(soundEnabled){
replySound.currentTime = 0;
replySound.play().catch(()=>{});
}

addMessage(reply,"bot");
}

// LOGOUT
function logout(){
auth.signOut().then(()=> window.location="login.html");
}

// SHARE
function shareApp(){
if(navigator.share){
navigator.share({
title:"ReplyShastra",
text:"Best AI reply app 🔥",
url:location.href
});
}else{
alert("Sharing not supported");
}
}

// SUBSCRIPTION
function openSubscription(){
alert("💎 Premium ₹99/month coming soon");
}

// INSTALL
let deferredPrompt;

window.addEventListener('beforeinstallprompt',(e)=>{
e.preventDefault();
deferredPrompt=e;
});

function installApp(){
if(deferredPrompt){
deferredPrompt.prompt();
}else{
alert("Install option not available");
}
}

// POPUP
setTimeout(()=>{
popup.style.display="flex";
},5000);

function closePopup(){
popup.style.display="none";
}

// SW
if('serviceWorker' in navigator){
navigator.serviceWorker.register('sw.js');
}

</script>
