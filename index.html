
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ReplyShastra</title>

<style>
body{
margin:0;
background:black;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:sans-serif;
}
</style>

</head>

<body>

<h2>Welcome to ReplyShastra...</h2>

<script>

// 🔥 SAFE START (no crash)
document.addEventListener("DOMContentLoaded", function(){

setTimeout(()=>{

try{

let user = localStorage.getItem("rs_user")

if(user){
window.location.href = "/app.html"
}else{
window.location.href = "/login.html"
}

}catch(e){

// fallback (kabhi error aaye to login bhej de)
window.location.href = "/login.html"

}

},2000)

})

</script>

</body>
</html>
