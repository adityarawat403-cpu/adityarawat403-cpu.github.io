<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ReplyShastra Login</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
background:#050008;
color:white;
font-family:'Quicksand';
display:flex;
align-items:center;
justify-content:center;
height:100vh;
margin:0;
}

.box{
background:#140021;
padding:30px;
border-radius:20px;
width:90%;
max-width:320px;
text-align:center;
box-shadow:0 0 25px #7b2cff;
}

input{
width:100%;
padding:14px;
margin:10px 0;
border:none;
border-radius:12px;
background:#0e0e14;
color:white;
}

button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:12px;
background:linear-gradient(135deg,#7b2cff,#b067ff);
color:white;
font-weight:600;
cursor:pointer;
}

#toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#7b2cff;
padding:12px 20px;
border-radius:12px;
display:none;
}

</style>

</head>

<body>

<div class="box">

<h2>ReplyShastra</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>
<button onclick="signup()">Create Account</button>
<button onclick="googleLogin()">Login with Google</button>

</div>

<div id="toast"></div>

<!-- 🔥 FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script>

// 🔥 CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyABlrB9kBCJV1YS-8t3SJrqHUfPqB-7lMo",
  authDomain: "replyshastra.firebaseapp.com",
  projectId: "replyshastra",
  storageBucket: "replyshastra.firebasestorage.app",
  messagingSenderId: "346754998835",
  appId: "1:346754998835:web:ecca09c1bb98a5f9a7f946"
};

// SAFE INIT
if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();

// AUTO LOGIN
auth.onAuthStateChanged(user => {
  if(user){
    localStorage.setItem("rs_user", user.email);
    window.location = "app.html";
  }
});

// LOGIN
function login(){
  let email = document.getElementById("email").value;
  let pass = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email, pass)
  .then(()=>window.location="app.html")
  .catch(err=>showToast(err.message));
}

// SIGNUP
function signup(){
  let email = document.getElementById("email").value;
  let pass = document.getElementById("password").value;

  auth.createUserWithEmailAndPassword(email, pass)
  .then(()=>{
    showToast("Account created ✅");
    window.location="app.html";
  })
  .catch(err=>showToast(err.message));
}

// GOOGLE LOGIN
function googleLogin(){
  let provider = new firebase.auth.GoogleAuthProvider();

  auth.signInWithPopup(provider)
  .then(()=>window.location="app.html")
  .catch(err=>showToast(err.message));
}

// TOAST
function showToast(msg){
  let t=document.getElementById("toast");
  t.innerText=msg;
  t.style.display="block";

  setTimeout(()=>{ t.style.display="none"; },2000);
}

</script>

</body>
</html>
