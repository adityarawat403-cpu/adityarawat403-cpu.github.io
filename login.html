<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReplyShastra Login</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

<!-- 🔥 FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
body{
background:#0a0015;
font-family:'Quicksand';
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
color:white;
margin:0;
}

.card{
background:#140021;
padding:30px;
border-radius:20px;
width:90%;
max-width:340px;
text-align:center;
box-shadow:0 0 35px rgba(123,44,255,0.5);
}

input{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:none;
background:#0d0d14;
color:white;
}

button{
margin-top:12px;
width:100%;
padding:12px;
border:none;
border-radius:12px;
background:linear-gradient(135deg,#7b2cff,#b067ff);
color:white;
font-weight:600;
cursor:pointer;
}
</style>

</head>

<body>

<div class="card">

<h2>ReplyShastra</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>
<button onclick="signup()">Create Account</button>
<button onclick="googleLogin()">Login with Google</button>

</div>

<script>

// 🔥 FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyABlrB9kBCJV1YS-8t3SJrqHUfPqB-7lMo",
  authDomain: "replyshastra.firebaseapp.com",
  projectId: "replyshastra",
  storageBucket: "replyshastra.firebasestorage.app",
  messagingSenderId: "346754998835",
  appId: "1:346754998835:web:ecca09c1bb98a5f9a7f946"
};

const auth = firebase.auth();

// 🔐 LOGIN
function login(){
let email=document.getElementById("email").value;
let pass=document.getElementById("password").value;

auth.signInWithEmailAndPassword(email,pass)
.then(()=>{
window.location="app.html";
})
.catch(err=>{
alert(err.message);
});
}

// 🆕 SIGNUP
function signup(){
let email=document.getElementById("email").value;
let pass=document.getElementById("password").value;

auth.createUserWithEmailAndPassword(email,pass)
.then(()=>{
alert("Account created!");
})
.catch(err=>{
alert(err.message);
});
}

// 🔥 GOOGLE LOGIN
function googleLogin(){
let provider = new firebase.auth.GoogleAuthProvider();

auth.signInWithPopup(provider)
.then(()=>{
window.location="app.html";
})
.catch(err=>{
alert(err.message);
});
}

</script>

</body>
</html>
