<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ReplyShastra AI</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7b2cff">
<link rel="icon" href="icon.png">

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:'Quicksand',sans-serif;}

body{
background:#050008;
color:white;
height:100vh;
overflow:hidden;
}

/* INTRO */
#intro{
position:fixed;
inset:0;
background:black;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:999;
}

#intro img{
width:120px;
animation:zoom 1.5s ease;
}

#intro h1{
margin-top:20px;
font-size:20px;
opacity:.8;
}

@keyframes zoom{
0%{transform:scale(.5);opacity:0}
100%{transform:scale(1);opacity:1}
}

/* HEADER */
.header{
position:fixed;
top:0;
left:0;
right:0;
height:65px;
display:flex;
align-items:center;
gap:12px;
padding:0 15px;
background:rgba(0,0,0,.55);
z-index:60;
}

.menuBtn{font-size:26px;cursor:pointer;}

.logo img{width:34px;border-radius:10px;}

.username{margin-left:auto;font-size:13px;opacity:.8;}

/* MENU */
.sideMenu{
position:fixed;
top:0;
left:-260px;
width:260px;
height:100%;
background:#140021;
padding:20px;
transition:.3s;
z-index:100;
}

.sideMenu a{
display:block;
margin:18px 0;
color:white;
text-decoration:none;
}

#menuOverlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
display:none;
}

/* CHAT */
.chatbox{
position:fixed;
top:65px;
bottom:78px;
left:0;
right:0;
padding:15px;
display:flex;
flex-direction:column;
gap:10px;
overflow:auto;
background:url("weapon-bg.png") center/cover;
}

.msg{padding:10px;border-radius:15px;max-width:70%;}

.user{
align-self:flex-end;
background:linear-gradient(135deg,#7b2cff,#b067ff);
}

.bot{
align-self:flex-start;
background:#1b1b24;
}

/* INPUT */
.inputArea{
position:fixed;
bottom:0;
left:0;
right:0;
display:flex;
gap:10px;
padding:10px;
background:#000;
}

input{
flex:1;
padding:12px;
border-radius:10px;
border:none;
background:#111;
color:white;
}

button{
padding:10px 15px;
border:none;
border-radius:10px;
background:white;
color:black;
cursor:pointer;
}

</style>

</head>

<body>

<!-- INTRO -->
<div id="intro">
<img src="icon.png">
<h1>Welcome to ReplyShastra...</h1>
</div>

<!-- MENU -->
<div id="menu" class="sideMenu">
<a onclick="openSub()">Subscription</a>
<a onclick="shareApp()">Share App</a>
<a href="about.html">About</a>
<a href="privacy.html">Privacy</a>
<a href="terms.html">Terms</a>
<a onclick="installApp()">⬇ Download App</a>
<a onclick="logout()">Logout</a>
</div>

<div id="menuOverlay" onclick="toggleMenu()"></div>

<!-- HEADER -->
<div class="header">
<div class="menuBtn" onclick="toggleMenu()">☰</div>
<div class="logo"><img src="icon.png"></div>
<div>ReplyShastra</div>
<div id="username" class="username"></div>
</div>

<!-- CHAT -->
<div id="chat" class="chatbox"></div>

<!-- INPUT -->
<div class="inputArea">
<input id="text" placeholder="Describe your situation...">
<button onclick="send()">Send</button>
</div>

<!-- AUDIO -->
<audio id="introSound" src="intro.mp3"></audio>
<audio id="sendSound" src="send.mp3"></audio>
<audio id="replySound" src="reply.mp3"></audio>

<script>

// USER
const user = localStorage.getItem("rs_user")
if(!user){window.location="login.html"}

const name = user.split("@")[0]
document.getElementById("username").innerText=name

// INTRO
window.onload=()=>{
document.getElementById("introSound").play().catch(()=>{})
setTimeout(()=>{
document.getElementById("intro").style.display="none"
},2500)
}

// MENU
let open=false
function toggleMenu(){
open=!open
document.getElementById("menu").style.left=open?"0":"-260px"
document.getElementById("menuOverlay").style.display=open?"block":"none"
}

// CHAT
function send(){
let text=document.getElementById("text").value
if(!text)return

document.getElementById("sendSound").play().catch(()=>{})

addMsg(text,"user")

setTimeout(()=>{
addMsg("AI reply aa gaya 😎","bot")
document.getElementById("replySound").play().catch(()=>{})
},1000)

document.getElementById("text").value=""
}

function addMsg(msg,type){
let div=document.createElement("div")
div.className="msg "+type
div.innerText=msg
document.getElementById("chat").appendChild(div)
}

// MENU FUNCTIONS
function logout(){
localStorage.clear()
window.location="login.html"
}

function shareApp(){
navigator.share({
title:"ReplyShastra",
text:"Try this app",
url:location.href
})
}

function installApp(){
alert("Install coming soon")
}

function openSub(){
alert("Subscription coming soon")
}

</script>

</body>
</html>
