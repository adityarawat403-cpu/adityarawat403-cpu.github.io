<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ReplyShastra AI</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7b2cff">
<link rel="icon" href="icon.png">

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:'Quicksand',sans-serif;}

body{background:#050008;color:white;height:100vh;overflow:hidden;}

/* INTRO */
#introScreen{
position:fixed;
inset:0;
background:#050008;
display:flex;
align-items:center;
justify-content:center;
z-index:999;
}

#introScreen img{
width:120px;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.1)}
100%{transform:scale(1)}
}

/* HEADER */
.header{
position:fixed;
top:0;
left:0;
right:0;
height:65px;
display:flex;
align-items:center;
gap:12px;
padding:0 15px;
background:rgba(0,0,0,.55);
z-index:60;
}

.menuBtn{font-size:26px;cursor:pointer;}

.logo img{width:34px;border-radius:10px;}

.username{margin-left:auto;font-size:13px;opacity:.8;}

/* MENU */
.sideMenu{
position:fixed;
top:0;
left:-260px;
width:260px;
height:100%;
background:#140021;
padding:20px;
transition:.3s;
z-index:100;
}

.sideMenu a{display:block;margin:18px 0;color:white;text-decoration:none;}

.installBtnMenu{
margin-top:20px;
padding:12px;
text-align:center;
background:linear-gradient(135deg,#7b2cff,#b067ff);
border-radius:10px;
}

#menuOverlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
display:none;
}

/* CHAT */
.chatbox{
position:fixed;
top:65px;
bottom:80px;
left:0;
right:0;
overflow:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:12px;
background:url("weapon-bg.png") center/cover no-repeat;
}

.msg{
max-width:75%;
padding:12px;
border-radius:16px;
}

.user{
align-self:flex-end;
background:linear-gradient(135deg,#7b2cff,#b067ff);
}

.bot{
align-self:flex-start;
background:#1b1b24;
}

.copyBtn{
font-size:12px;
margin-top:5px;
opacity:.7;
cursor:pointer;
}

/* INPUT */
.inputArea{
position:fixed;
bottom:0;
left:0;
right:0;
display:flex;
gap:10px;
padding:10px;
background:rgba(0,0,0,.6);
}

input{
flex:1;
padding:12px;
border:none;
border-radius:10px;
background:#0e0e14;
color:white;
}

button{
padding:12px;
border:none;
border-radius:10px;
background:white;
color:black;
}

/* TYPING */
.typing{
display:flex;
gap:4px;
}

.dot{
width:6px;height:6px;background:white;border-radius:50%;
animation:blink 1.2s infinite;
}

@keyframes blink{
0%,80%,100%{opacity:.2}
40%{opacity:1}
}

</style>

</head>

<body>

<!-- INTRO -->
<div id="introScreen">
<img src="icon.png">
</div>

<!-- MENU -->
<div id="menu" class="sideMenu">
<a href="#">Subscription</a>
<a href="#" onclick="shareApp()">Share App</a>
<a href="#">About</a>
<a href="#">Privacy</a>
<a href="#">Terms</a>

<div class="installBtnMenu">
<a href="#" onclick="installApp()">⬇ Download App</a>
</div>

<hr>

<a href="#" onclick="logout()">Logout</a>
</div>

<div id="menuOverlay"></div>

<!-- HEADER -->
<div class="header">
<div class="menuBtn" onclick="toggleMenu()">☰</div>
<div class="logo"><img src="icon.png"></div>
<div>ReplyShastra</div>
<div id="username" class="username"></div>
</div>

<!-- CHAT -->
<div id="chat" class="chatbox"></div>

<!-- INPUT -->
<div class="inputArea">
<input id="text" placeholder="Describe your situation...">
<button onclick="send()">Send</button>
</div>

<!-- AUDIO -->
<audio id="sendSound" src="send.mp3"></audio>
<audio id="replySound" src="reply.mp3"></audio>
<audio id="typingSound" src="typing.mp3"></audio>

<script>

const user = localStorage.getItem("rs_user")
if(!user){window.location="login.html"}

const name = user.split("@")[0]
document.getElementById("username").innerText=name+" | 10 left"

let menuOpen=false

function toggleMenu(){
let menu=document.getElementById("menu")
let overlay=document.getElementById("menuOverlay")

menuOpen=!menuOpen
menu.style.left=menuOpen?"0":"-260px"
overlay.style.display=menuOpen?"block":"none"
}

document.getElementById("menuOverlay").onclick=toggleMenu

const chat=document.getElementById("chat")
const text=document.getElementById("text")

function addMessage(msg,type){
let div=document.createElement("div")
div.className="msg "+type
div.innerText=msg

if(type==="bot"){
let copy=document.createElement("div")
copy.className="copyBtn"
copy.innerText="Copy"
copy.onclick=()=>navigator.clipboard.writeText(msg)
div.appendChild(copy)
}

chat.appendChild(div)
chat.scrollTop=chat.scrollHeight
}

function showTyping(){
let t=document.createElement("div")
t.className="typing"
t.id="typing"
t.innerHTML="<div class='dot'></div><div class='dot'></div><div class='dot'></div>"
chat.appendChild(t)

document.getElementById("typingSound").play()
}

function removeTyping(){
let t=document.getElementById("typing")
if(t)t.remove()
}

function send(){
let msg=text.value.trim()
if(!msg)return

document.getElementById("sendSound").play()

addMessage(msg,"user")
text.value=""

showTyping()

setTimeout(()=>{
removeTyping()

addMessage("Example reply generated by AI.","bot")

document.getElementById("replySound").play()

},1200)
}

function logout(){
localStorage.removeItem("rs_user")
window.location="login.html"
}

function shareApp(){
if(navigator.share){
navigator.share({
title:"ReplyShastra AI",
url:"https://replyshastra.web.app"
})
}else{
alert("Share not supported")
}
}

let deferredPrompt

window.addEventListener('beforeinstallprompt',(e)=>{
e.preventDefault()
deferredPrompt=e
})

function installApp(){
if(deferredPrompt){
deferredPrompt.prompt()
}else{
alert("Install not available")
}
}

/* INTRO HIDE */
window.onload=()=>{
setTimeout(()=>{
document.getElementById("introScreen").style.display="none"
},2000)
}

</script>

</body>
</html>
