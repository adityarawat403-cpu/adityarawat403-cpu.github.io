
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ReplyShastra AI</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7b2cff">
<link rel="icon" href="icon.png">

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:'Quicksand',sans-serif;}

body{
background:#050008;
color:white;
height:100vh;
overflow:hidden;
}

/* HEADER */

.header{
position:fixed;
top:0;
left:0;
right:0;
height:65px;
display:flex;
align-items:center;
gap:12px;
padding:0 15px;
background:rgba(0,0,0,.55);
z-index:60;
backdrop-filter:blur(10px);
}

.menuBtn{font-size:26px;cursor:pointer;}

.logo img{width:34px;border-radius:10px;}

.username{margin-left:auto;font-size:13px;opacity:.8;}

/* MENU */

.sideMenu{
position:fixed;
top:0;
left:-260px;
width:260px;
height:100%;
background:#140021;
padding:20px;
transition:.35s;
z-index:100;
}

.sideMenu a{
display:block;
margin:18px 0;
color:white;
text-decoration:none;
}

/* OVERLAY */

#menuOverlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
display:none;
z-index:50;
}

/* CHAT */

.chatbox{
position:fixed;
top:65px;
bottom:75px;
left:0;
right:0;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:12px;

/* ✅ BACKGROUND FIX */
background-image:url("./weapon-bg.png");
background-size:cover;
background-position:center;
}

/* MESSAGES */

.msg{
max-width:78%;
padding:12px;
border-radius:18px;
font-size:15px;
}

.user{
align-self:flex-end;
background:linear-gradient(135deg,#7b2cff,#b067ff);
}

.bot{
align-self:flex-start;
background:#1b1b24;
}

/* INPUT */

.inputArea{
position:fixed;
bottom:0;
left:0;
right:0;
display:flex;
gap:10px;
padding:12px;
background:rgba(0,0,0,.65);
}

input{
flex:1;
padding:14px;
border-radius:14px;
border:none;
background:#0e0e14;
color:white;
}

.sendBtn{
padding:12px 18px;
border:none;
border-radius:14px;
background:white;
color:black;
font-weight:600;
cursor:pointer;
}

</style>
</head>

<body>

<!-- MENU -->
<div id="menu" class="sideMenu">
<a href="#" onclick="installApp()">⬇ Install App</a>
<a href="#" onclick="shareApp()">Share App</a>
<a href="about.html">About</a>
<a href="privacy.html">Privacy</a>
<a href="terms.html">Terms</a>
<a href="#" onclick="logout()">Logout</a>
</div>

<div id="menuOverlay"></div>

<!-- HEADER -->
<div class="header">
<div class="menuBtn" onclick="toggleMenu()">☰</div>
<div class="logo"><img src="icon.png"></div>
<div>ReplyShastra</div>
<div id="username" class="username"></div>
</div>

<!-- CHAT -->
<div id="chat" class="chatbox"></div>

<!-- INPUT -->
<div class="inputArea">
<input id="text" placeholder="Describe your situation...">
<button class="sendBtn" onclick="send()">Send</button>
</div>

<script>

/* USER CHECK */
let user = localStorage.getItem("rs_user")
if(!user){ window.location="login.html" }

let name = user.includes("@") ? user.split("@")[0] : user
document.getElementById("username").innerText = name

/* MENU */
let open=false
function toggleMenu(){
open=!open
document.getElementById("menu").style.left = open?"0":"-260px"
document.getElementById("menuOverlay").style.display = open?"block":"none"
}
document.getElementById("menuOverlay").onclick = toggleMenu

/* CHAT */
const chat=document.getElementById("chat")
const text=document.getElementById("text")

function addMessage(msg,type){
let div=document.createElement("div")
div.className="msg "+type
div.innerText=msg
chat.appendChild(div)
chat.scrollTop=chat.scrollHeight
}

function send(){
let msg=text.value.trim()
if(!msg) return
addMessage(msg,"user")
text.value=""

setTimeout(()=>{
addMessage("Example reply generated by AI.","bot")
},1000)
}

/* LOGOUT */
function logout(){
localStorage.removeItem("rs_user")
window.location="login.html"
}

/* SHARE */
function shareApp(){
alert("Share coming soon")
}

/* ✅ INSTALL FIX (WORKING) */
let deferredPrompt

window.addEventListener('beforeinstallprompt', (e) => {
e.preventDefault()
deferredPrompt = e
})

function installApp(){
if(deferredPrompt){
deferredPrompt.prompt()
}else{
alert("Install not ready yet")
}
}

/* ✅ SERVICE WORKER */
if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('sw.js')
}

</script>

</body>
</html>
