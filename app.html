<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReplyShastra</title>
</head>

<body>

<!-- ⚡ BASIC UI (ensure ye elements exist karein) -->
<div id="menu"></div>
<div id="menuOverlay"></div>
<div id="username"></div>
<div id="menuName"></div>
<div id="chat"></div>

<input id="text" placeholder="Type message...">
<button onclick="send()">Send</button>

<!-- 🔥 SCRIPT HAMESHA LAST ME -->
<script>

document.addEventListener("DOMContentLoaded", function(){

// 🔐 USER CHECK
let user = localStorage.getItem("rs_user")

if(!user){
window.location.href="/login.html"
return
}

// 🔥 SAFE NAME
let name = user.includes("@") ? user.split("@")[0] : user

// 🔥 ELEMENTS
const usernameEl = document.getElementById("username")
const menuNameEl = document.getElementById("menuName")
const menuOverlay = document.getElementById("menuOverlay")
const chat = document.getElementById("chat")
const text = document.getElementById("text")

if(usernameEl) usernameEl.innerText = name
if(menuNameEl) menuNameEl.innerText = name

// 🔢 REPLY LIMIT
let repliesLeft = localStorage.getItem("replies_left") || 10
localStorage.setItem("replies_left", repliesLeft)

// 💬 ADD MESSAGE
window.addMessage = function(msg,type){

if(!chat) return

let div=document.createElement("div")
div.innerText=msg
chat.appendChild(div)

}

// 🚀 SEND
window.send = function(){

if(repliesLeft<=0){
addMessage("Limit reached","bot")
return
}

let msg = text.value.trim()
if(!msg) return

addMessage(msg,"user")

text.value=""

setTimeout(()=>{
addMessage("AI reply working...","bot")
repliesLeft--
localStorage.setItem("replies_left",repliesLeft)
},1000)

}

// 🚪 LOGOUT
window.logout = function(){
localStorage.removeItem("rs_user")
window.location.href="/login.html"
}

})

</script>

</body>
</html>
