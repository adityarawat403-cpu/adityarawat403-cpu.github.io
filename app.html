<script>

const user = localStorage.getItem("rs_user")

if(!user){
window.location="login.html"
}

const name = user.split("@")[0]

document.getElementById("username").innerText=name
document.getElementById("menuName").innerText=name

let repliesLeft = localStorage.getItem("replies_left")

if(!repliesLeft){
repliesLeft=10
localStorage.setItem("replies_left",10)
}

function updateHeader(){
document.getElementById("username").innerText=name+" | "+repliesLeft+" left"
}

updateHeader()

let menuOpen=false

function toggleMenu(){

const menu=document.getElementById("menu")
const overlay=document.getElementById("menuOverlay")

menuOpen=!menuOpen

menu.style.left=menuOpen?"0":"-260px"
overlay.style.display=menuOpen?"block":"none"

}

document.getElementById("menuOverlay").onclick=toggleMenu

const chat=document.getElementById("chat")
const text=document.getElementById("text")

function addMessage(msg,type){

let div=document.createElement("div")
div.className="msg "+type
div.innerText=msg

if(type==="bot"){

let copy=document.createElement("div")
copy.className="copyBtn"
copy.innerText="Copy"

copy.onclick=()=>{
navigator.clipboard.writeText(msg)
copy.innerText="Copied"
setTimeout(()=>copy.innerText="Copy",1200)
}

div.appendChild(copy)

}

chat.appendChild(div)
chat.scrollTop=chat.scrollHeight

}

function showTyping(){

let typing=document.createElement("div")

typing.className="typing"
typing.id="typing"

typing.innerHTML="<div class='dot'></div><div class='dot'></div><div class='dot'></div>"

chat.appendChild(typing)

try{
document.getElementById("typingSound").play()
}catch{}

}

function removeTyping(){

let t=document.getElementById("typing")
if(t)t.remove()

}

function send(){

if(repliesLeft<=0){

addMessage("Daily reply limit reached.","bot")
return

}

let msg=text.value.trim()

if(!msg)return

try{
document.getElementById("sendSound").play()
}catch{}

addMessage(msg,"user")

text.value=""

showTyping()

setTimeout(()=>{

removeTyping()

let reply="Example reply generated by AI."

addMessage(reply,"bot")

try{
document.getElementById("replySound").play()
}catch{}

repliesLeft--

localStorage.setItem("replies_left",repliesLeft)

updateHeader()

},1200)

}

text.addEventListener("keypress",e=>{
if(e.key==="Enter")send()
})

function logout(){

localStorage.removeItem("rs_user")
window.location="login.html"

}

/* SHARE APP */

function shareApp(){

if(navigator.share){

navigator.share({
title:"ReplyShastra AI",
text:"Try ReplyShastra AI",
url:"https://replyshastra.web.app"
})

}else{

alert("Share not supported on this device")

}

}

/* SUBSCRIPTION */

function openSubscription(){

alert("Subscription page coming soon")

}

/* INSTALL APP */

let deferredPrompt;

window.addEventListener('beforeinstallprompt',(e)=>{
e.preventDefault()
deferredPrompt=e
})

function installApp(){

if(deferredPrompt){

deferredPrompt.prompt()

deferredPrompt.userChoice.then(()=>{
deferredPrompt=null
})

}else{

alert("Install option not available yet")

}

}

/* INTRO ANIMATION */

window.onload = () => {

setTimeout(()=>{

let intro=document.getElementById("introScreen")

if(intro){
intro.style.display="none"
}

},2000)

}

  </script>
